<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上訂購系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 font-sans min-h-screen pb-24">
    <!-- Header -->
    <header class="bg-amber-800 text-white p-4 shadow-md text-center sticky top-0 z-10">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">🍵 茶品線上訂購</h1>
    </header>

    <main class="max-w-md sm:max-w-xl md:max-w-3xl lg:max-w-4xl mx-auto p-4 md:p-6 space-y-6">
        <!-- 商品價目表區域 -->
        <section>
            <h2 class="text-lg md:text-xl font-bold border-b-2 border-amber-800 pb-2 mb-4 text-amber-900">選購商品</h2>
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-500 text-center py-4 col-span-full">載入商品中...</p>
            </div>
        </section>
    </main>

    <!-- 底部購物車浮動面板 -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-stone-200 p-4 shadow-lg">
        <div class="max-w-md sm:max-w-xl md:max-w-3xl lg:max-w-4xl mx-auto flex items-center justify-between">
            <div>
                <span class="text-sm text-gray-500">已選購品項: </span>
                <span id="cart-count" class="font-bold text-amber-800">0</span> 件
                <div class="text-lg sm:text-xl font-bold text-red-600">總計: $<span id="cart-total">0</span></div>
            </div>
            <button onclick="checkout()" class="bg-amber-700 hover:bg-amber-800 text-white font-bold px-6 py-2.5 rounded-lg shadow transition text-sm sm:text-base">
                結帳下單
            </button>
        </div>
    </div>

    <!-- 提示彈窗 UI (替代 alert) -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-5 max-w-xs w-full text-center space-y-4 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg text-amber-900"></h3>
            <p id="modal-msg" class="text-sm text-stone-600"></p>
            <button onclick="closeModal()" class="w-full bg-amber-800 text-white py-2 rounded-lg font-medium">確定</button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {};

        // 載入商品價目表資料
        async function fetchProducts() {
            try {
                const res = await fetch('/api/prices');
                products = await res.json();
                renderProducts();
            } catch (err) {
                showModal('錯誤', '無法載入商品價目表資料');
            }
        }

        // 渲染商品列表
        function renderProducts() {
            const container = document.getElementById('product-list');
            if (products.length === 0) {
                container.innerHTML = '<p class="text-stone-500 text-center py-4 col-span-full">目前沒有提供商品。</p>';
                return;
            }

            // 預設茶品圖片庫（可依商品類別或名稱自動對應）
            const defaultImages = {
                '特選阿里山烏龍茶 (150g)': 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=600&q=80',
                '凍頂烏龍茶 (150g)': 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80',
                '日月潭紅玉紅茶 (100g)': 'https://images.unsplash.com/photo-1597481499750-3e6b22637e12?auto=format&fit=crop&w=600&q=80',
                '雙罐高山茶禮盒': 'https://images.unsplash.com/photo-1563822249510-04678c787dd2?auto=format&fit=crop&w=600&q=80'
            };

            container.innerHTML = products.map(item => {
                const imgUrl = item.image_url || defaultImages[item.item_name] || `https://placehold.co/600x400/78350f/ffffff?text=${encodeURIComponent(item.item_name)}`;
                
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-amber-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-300">
                    <div class="relative aspect-video bg-stone-100 overflow-hidden">
                        <img src="${imgUrl}" 
                             alt="${item.item_name}" 
                             onerror="this.onerror=null;this.src='https://placehold.co/600x400/78350f/ffffff?text=${encodeURIComponent(item.item_name)}';" 
                             class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 text-xs bg-amber-900/80 text-white px-2 py-0.5 rounded-md backdrop-blur-sm font-medium">${item.category}</span>
                    </div>
                    <div class="p-4 flex flex-col justify-between flex-grow space-y-3">
                        <div>
                            <h3 class="font-bold text-stone-800 text-base md:text-lg">${item.item_name}</h3>
                            <p class="text-amber-700 font-extrabold mt-1 text-base md:text-lg">${item.price}</p>
                        </div>
                        <button onclick="addToCart(${item.id})" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-semibold px-3 py-2.5 rounded-xl text-sm transition shadow-sm flex items-center justify-center space-x-1">
                            <span>+ 加入購物車</span>
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // 加入購物車 logic
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                // 拆解價格數字 (例如: "$600 元" -> 600)
                const numericPrice = parseInt(product.price.replace(/[^\d]/g, '')) || 0;
                cart[id] = { ...product, numericPrice, qty: 1 };
            }
            updateCartUI();
        }

        // 更新購物車 UI
        function updateCartUI() {
            let totalQty = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalQty += item.qty;
                totalPrice += item.numericPrice * item.qty;
            });

            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total').innerText = totalPrice.toLocaleString();
        }

        // 結帳功能
        async function checkout() {
            const totalQty = parseInt(document.getElementById('cart-count').innerText);
            if (totalQty === 0) {
                showModal('提示', '購物車是空的，請先選擇商品！');
                return;
            }

            const itemsSummary = Object.values(cart)
                .map(i => `${i.item_name} x ${i.qty}`)
                .join('\n');

            const totalPrice = parseInt(document.getElementById('cart-total').innerText.replace(/,/g, '')) || 0;
            
            // 從 Session 或 URL 取得 LINE User ID
            const userSession = JSON.parse(sessionStorage.getItem('user') || '{}');
            const urlParams = new URLSearchParams(window.location.search);
            const lineUserId = userSession.line_user_id || urlParams.get('line_user_id') || '';

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_user_id: lineUserId,
                        items_summary: itemsSummary,
                        total_price: totalPrice
                    })
                });

                if (res.ok) {
                    showModal('訂購成功', `已成功下單！共 ${totalQty} 件商品，總金額為 $${totalPrice.toLocaleString()} 元。`, () => {
                        // 帶上 line_user_id 轉址前往歷史訂單頁面
                        window.location.href = `/orders${lineUserId ? '?line_user_id=' + lineUserId : ''}`;
                    });
                    cart = {};
                    updateCartUI();
                } else {
                    showModal('下單失敗', '請重試！');
                }
            } catch (err) {
                showModal('錯誤', '網路連線異常！');
            }
        }

        function showModal(title, msg, callback) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            if (window.modalCallback) window.modalCallback();
        }

        fetchProducts();
    </script>
</body>
</html>
