<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上訂購 - 茶品專賣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-amber-50/30 min-h-screen text-slate-800 flex flex-col justify-between">
    <div>
        <!-- 導覽列 -->
        <nav class="bg-amber-900 text-amber-100 shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🍵</span>
                    <h1 class="text-xl font-bold tracking-wide">茶品線上訂購</h1>
                </div>
                <div class="flex flex-wrap justify-center gap-4 text-sm font-medium">
                    <a href="/" class="hover:text-white transition">首頁</a>
                    <a href="/prices" class="hover:text-white transition">價目表</a>
                    <a href="/orders" class="hover:text-white transition">歷史訂單</a>
                </div>
            </div>
        </nav>

        <!-- 主內容區 -->
        <main class="max-w-6xl mx-auto px-4 py-8">
            <h2 class="text-2xl font-bold mb-6 text-amber-900 border-b border-amber-200 pb-2">選購商品</h2>
            
            <!-- 商品卡片列表 (動態渲染) -->
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- JS 自動填入商品 -->
            </div>

            <!-- 結帳浮動列 -->
            <div class="mt-8 bg-white p-6 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-center gap-4 sticky bottom-4 border border-amber-100">
                <div>
                    <span class="text-slate-500 text-sm">已選購品項：</span>
                    <span id="cart-count" class="font-bold text-slate-800">0</span> 件
                    <div class="text-xl font-bold text-amber-900 mt-1">
                        總計: <span id="cart-total" class="text-red-600">0</span> 元
                    </div>
                </div>
                <button onclick="submitOrder()" class="w-full sm:w-auto bg-amber-800 hover:bg-amber-900 text-white font-bold px-8 py-3 rounded-xl shadow transition transform active:scale-95">
                    結帳下單
                </button>
            </div>
        </main>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-12">
        <p>&copy; 2026 茶品線上訂購系統. All rights reserved.</p>
    </footer>

    <script>
        // 商品資料 (包含圖片連結與備援圖片)
        const products = [
            { id: 1, name: '特選阿里山烏龍茶 (150g)', price: 600, category: '茶葉類', image: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500' },
            { id: 2, name: '凍頂烏龍茶 (150g)', price: 550, category: '茶葉類', image: 'https://images.unsplash.com/photo-1597481499750-3e6b22637e12?w=500' },
            { id: 3, name: '日月潭紅玉紅茶 (100g)', price: 480, category: '茶葉類', image: 'https://images.unsplash.com/photo-1594631252845-29fc4cc86de9?w=500' },
            { id: 4, name: '雙罐高山茶禮盒', price: 1280, category: '禮盒類', image: 'https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500' },
            { id: 5, name: '一對一茶藝體驗課 (90min)', price: 1200, category: '體驗課程', image: 'https://images.unsplash.com/photo-1563822249510-04678c78fa85?w=500' }
        ];

        let cart = {};

        // 渲染商品列表 (含圖片)
        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl shadow-md overflow-hidden border border-amber-100 flex flex-col justify-between hover:shadow-lg transition">
                    <div class="relative h-48 bg-amber-100 overflow-hidden">
                        <img src="${p.image}" 
                             alt="${p.name}" 
                             onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500';"
                             class="w-full h-full object-cover transform hover:scale-105 transition duration-500">
                        <span class="absolute top-3 left-3 bg-amber-900/80 text-amber-100 text-xs px-2.5 py-1 rounded-full backdrop-blur-sm">
                            ${p.category}
                        </span>
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg text-slate-800 mb-1">${p.name}</h3>
                            <div class="text-amber-900 font-bold text-xl mb-4">$${p.price} <span class="text-xs text-slate-400 font-normal">元</span></div>
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-2 border-t border-slate-100">
                            <button onclick="updateQty(${p.id}, -1)" class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-100 active:bg-slate-200 transition font-bold">-</button>
                            <span id="qty-${p.id}" class="font-bold text-slate-700 w-8 text-center">0</span>
                            <button onclick="updateQty(${p.id}, 1)" class="w-9 h-9 rounded-lg bg-amber-800 text-white flex items-center justify-center hover:bg-amber-900 active:scale-95 transition font-bold">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateQty(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            
            document.getElementById(`qty-${id}`).innerText = cart[id] || 0;
            updateSummary();
        }

        function updateSummary() {
            let count = 0;
            let total = 0;
            for (let id in cart) {
                const item = products.find(p => p.id == id);
                if (item) {
                    count += cart[id];
                    total += cart[id] * item.price;
                }
            }
            document.getElementById('cart-count').innerText = count;
            document.getElementById('cart-total').innerText = total;
        }

        async function submitOrder() {
            const items = Object.keys(cart).map(id => {
                const p = products.find(prod => prod.id == id);
                return `${p.name} x ${cart[id]}`;
            });

            if (items.length === 0) {
                alert('請先選擇商品！');
                return;
            }

            const total = document.getElementById('cart-total').innerText;
            const urlParams = new URLSearchParams(window.location.search);
            const line_user_id = urlParams.get('line_user_id') || localStorage.getItem('line_user_id') || 'GUEST';

            try {
                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_user_id: line_user_id,
                        items_summary: items.join(', '), // 注意後端接收的參數名稱是 items_summary
                        total_price: parseInt(total)     // 總金額傳送數字型態
                    })
                });

                const data = await res.json();
                if (data.success) {
                    alert('訂單建立成功！');
                    cart = {};
                    renderProducts();
                    updateSummary();
                } else {
                    alert('訂單建立失敗：' + (data.message || '未知錯誤'));
}
            } catch (err) {
                alert('網路連線異常');
            }
        }

        renderProducts();
    </script>
</body>
</html>
