<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊 - 茶香專賣店</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-5 border border-amber-100">
        <h2 class="text-2xl font-bold text-center text-amber-900">🍵 會員註冊綁定</h2>
        <p class="text-xs text-center text-stone-500">將您的電話與 LINE 帳號進行綁定</p>

        <form id="reg-form" onsubmit="handleRegister(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">LINE User ID (必填)</label>
                <input type="text" id="line_user_id" required class="w-full border border-stone-300 rounded-lg p-2.5 bg-gray-50 focus:outline-none focus:border-amber-700 text-sm font-mono">
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">姓名</label>
                <input type="text" id="name" placeholder="請輸入姓名" required class="w-full border border-stone-300 rounded-lg p-2.5 focus:outline-none focus:border-amber-700 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">手機號碼 (登入帳號)</label>
                <input type="tel" id="phone" placeholder="0912345678" required class="w-full border border-stone-300 rounded-lg p-2.5 focus:outline-none focus:border-amber-700 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">設定密碼</label>
                <input type="password" id="password" required class="w-full border border-stone-300 rounded-lg p-2.5 focus:outline-none focus:border-amber-700 text-sm">
            </div>

            <button type="submit" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-bold py-3 rounded-lg shadow transition">
                完成註冊
            </button>
        </form>

        <div class="text-center text-xs text-stone-500 border-t pt-3">
            已有帳號？<a href="/login" class="text-amber-800 font-bold hover:underline">獨立登入</a>
        </div>
    </div>

    <!-- 彈窗 Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-5 max-w-xs w-full text-center space-y-4 shadow-xl">
            <h3 id="modal-title" class="font-bold text-lg text-amber-900"></h3>
            <p id="modal-msg" class="text-sm text-stone-600"></p>
            <button onclick="closeModal()" class="w-full bg-amber-800 text-white py-2 rounded-lg font-medium">確定</button>
        </div>
    </div>

    <script>
        // 自動抓取網址中的 line_user_id 參數
        const urlParams = new URLSearchParams(window.location.search);
        const urlLineId = urlParams.get('line_user_id');
        if (urlLineId) {
            document.getElementById('line_user_id').value = urlLineId;
        }

        async function handleRegister(e) {
            e.preventDefault();
            const payload = {
                line_user_id: document.getElementById('line_user_id').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                if (res.ok) {
                    showModal('註冊成功', result.message, () => {
                        window.location.href = '/login';
                    });
                } else {
                    showModal('註冊失敗', result.message);
                }
            } catch (err) {
                showModal('錯誤', '網路錯誤，請稍後再試！');
            }
        }

        function showModal(title, msg, callback) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('modal').classList.remove('hidden');
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            if (window.modalCallback) window.modalCallback();
        }
    </script>
</body>
</html>
